# Workflow reutilizable: despliega un ambiente. deploy.yml lo llama una vez por ambiente,
# de modo que dev y prod siguen exactamente los mismos pasos.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: Ambiente de GitHub y carpeta en infra/environments
        type: string
        required: true
      image:
        description: Imagen fijada por digest
        type: string
        required: true

jobs:
  deploy:
    name: Desplegar ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Este nombre define el "subject" del token OIDC y activa las reglas de protección del ambiente.
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    defaults:
      run:
        # Activa pipefail: sin esto, "estimate.py | tee" ocultaria el fallo del control de costos.
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_database_location: ${{ vars.AZURE_DB_LOCATION }}
      TF_VAR_image: ${{ inputs.image }}
      TF_VAR_max_replicas: ${{ inputs.environment == 'prod' && '3' || '1' }}
      TF_VAR_jwt_minutes: ${{ inputs.environment == 'prod' && '15' || '60' }}
      ROOT: infra/gcp/env
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración
        env:
          VALUES: >-
            AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}
            AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}
            AZURE_LOCATION=${{ vars.AZURE_LOCATION }}
            AZURE_DB_LOCATION=${{ vars.AZURE_DB_LOCATION }}
            TF_STATE_RESOURCE_GROUP=${{ vars.TF_STATE_RESOURCE_GROUP }}
            TF_STATE_STORAGE_ACCOUNT=${{ vars.TF_STATE_STORAGE_ACCOUNT }}
            TF_STATE_CONTAINER=${{ vars.TF_STATE_CONTAINER }}
            COST_BUDGET_USD=${{ vars.COST_BUDGET_USD }}
        run: |
          # Falla antes de tocar la nube si una variable falta o quedo con un texto de ejemplo.
          failed=0
          for pair in $VALUES; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = "__CAMBIAME__" ]; then
              echo "::error::Falta definir o completar la variable ${pair%%=*}"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Autenticar con OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AZURE_TENANT_ID }}
          service_account: ${{ vars.AZURE_CLIENT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~> 1.11

      - name: Terraform init
        run: |
          terraform -chdir="$ROOT" init \
            -backend-config="bucket=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="prefix=env/${{ inputs.environment }}"

      - name: Estimar costos con Infracost
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          COST_BUDGET_USD: ${{ vars.COST_BUDGET_USD }}
        run: |
          python scripts/estimate.py \
            --plan "$ROOT" \
            --budget "$COST_BUDGET_USD" \
            | tee infracost-comment.md
          cat infracost-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform -chdir="$ROOT" apply -auto-approve

      - name: Prueba de humo
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          URL="$(terraform -chdir="$ROOT" output -raw app_url)"
          bash scripts/smoke.sh "$URL"
          echo "### $ENVIRONMENT desplegado en $URL" >> "$GITHUB_STEP_SUMMARY"
