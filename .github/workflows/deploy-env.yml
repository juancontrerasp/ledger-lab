# Workflow reutilizable: despliega un ambiente. deploy.yml lo llama una vez por ambiente,
# de modo que dev y prod siguen exactamente los mismos pasos.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: Ambiente de GitHub y carpeta en infra/environments
        type: string
        required: true
      image:
        description: Imagen fijada por digest
        type: string
        required: true

jobs:
  deploy:
    name: Desplegar ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Este nombre define el "subject" del token OIDC y activa las reglas de protección del ambiente.
    environment: ${{ inputs.environment }}
    concurrency: terraform-${{ inputs.environment }}
    defaults:
      run:
        # Activa pipefail: sin esto, "estimate.py | tee" ocultaria el fallo del control de costos.
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_database_location: ${{ vars.AZURE_DB_LOCATION }}
      TF_VAR_image: ${{ inputs.image }}
      TF_VAR_max_replicas: ${{ inputs.environment == 'prod' && '3' || '1' }}
      TF_VAR_jwt_minutes: ${{ inputs.environment == 'prod' && '15' || '60' }}
      ROOT: infra/gcp/env
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración
        env:
          VALUES: >-
            AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID }}
            AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID }}
            AZURE_LOCATION=${{ vars.AZURE_LOCATION }}
            AZURE_DB_LOCATION=${{ vars.AZURE_DB_LOCATION }}
            TF_STATE_RESOURCE_GROUP=${{ vars.TF_STATE_RESOURCE_GROUP }}
            TF_STATE_STORAGE_ACCOUNT=${{ vars.TF_STATE_STORAGE_ACCOUNT }}
            TF_STATE_CONTAINER=${{ vars.TF_STATE_CONTAINER }}
            COST_BUDGET_USD=${{ vars.COST_BUDGET_USD }}
        run: |
          # Falla antes de tocar la nube si una variable falta o quedo con un texto de ejemplo.
          failed=0
          for pair in $VALUES; do
            value="${pair#*=}"
            if [ -z "$value" ] || [[ "$value" == *"<"* ]]; then
              echo "::error::Variable requerida no configurada o incompleta: ${pair%%=*}"
              failed=1
            fi
          done
          exit "$failed"

      - name: Autenticar con OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.AZURE_TENANT_ID }}
          service_account: ${{ vars.AZURE_CLIENT_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false

      - name: Terraform init
        env:
          STATE_KEY: ledger-${{ inputs.environment }}
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir="$ROOT" init -input=false \
            -backend-config="bucket=$STATE_ACCOUNT" \
            -backend-config="prefix=$STATE_KEY"

      - name: Terraform plan
        run: terraform -chdir="$ROOT" plan -input=false -out=deploy.tfplan

      - name: Estimar costos con Infracost
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUDGET: ${{ vars.COST_BUDGET_USD }}
        run: |
          terraform -chdir="$ROOT" show -json deploy.tfplan > "$RUNNER_TEMP/plan.json"
          python3 cost/estimate.py --offline --plan "$ENVIRONMENT=$RUNNER_TEMP/plan.json" --budget "$BUDGET" | tee "$RUNNER_TEMP/cost.txt"
          {
            echo "### Costo estimado de $ENVIRONMENT"
            echo '```'
            cat "$RUNNER_TEMP/cost.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        run: terraform -chdir="$ROOT" apply -input=false -auto-approve deploy.tfplan

      - name: Prueba de humo
        env:
          ROOT: infra/gcp/env
        run: |
          URL=$(terraform -chdir="$ROOT" output -raw app_url)
          echo "APP_URL=$URL" >> "$GITHUB_ENV"
          bash scripts/smoke.sh "$URL"
